Name: file.rpc
ListenOn: 0.0.0.0:9213

Log:
  ServiceName: fileRpcLogger
  Mode: console
  Level: info

DatabaseDSN: root:@tcp(127.0.0.1:3306)/admin_zero?charset=utf8mb4&parseTime=True&loc=Local&multiStatements=true

RedisConf:
  Host: 127.0.0.1:6379
  Type: node
  Pass:

UploadConf:
  PrivateStorePath: data/file/private
  PublicStorePath: data/file/public
  ServerURL: http://localhost:81
  MaxImageSize: 33554432    # 32 MB
  MaxVideoSize: 1073741824  # 1 GB
  MaxAudioSize: 33554432    # 32 MB
  MaxOtherSize: 10485760    # 10 MB
  DeleteFileWithCloud: true
